# Costing audit — SMOKE pack (runs in CI on PRs touching the calculator).
# 3 bodies x 3 lengths x 2 variants = 18 scenarios. Keep it under 2 minutes.
# RT2 (RT2_RULING_1 R5): every size is pinned to the golden it replaces, so the golden moves only by
# Burt's changes; and no PU on a chiller (Burt, 1 Oct) — the chiller's all_pu is now srd.
name: smoke
workbook_month: "2026-09"
tolerance_pct: 1.0
gate_mode: as_sheet
bodies:
  - sheet: "UP TO 5.5 CHILLER AND 2.3 WIDE"
    lengths: [4.2, 5.5, 5.8]
    widths: [2.3]
    heights: [2.3]
    variants: [as_sheet, srd]
  - sheet: " UP TO 4.8 MT FREEZER  (2"
    lengths: [4.2, 5.6, 6.0]
    widths: [2.5]
    heights: [2.4]
    variants: [as_sheet, roof_floor_eps]
  - sheet: "icecream up to 4.8"
    lengths: [3.6, 4.2, 4.8]
    widths: [2.3]
    heights: [2.26]
    variants: [as_sheet, srd]
