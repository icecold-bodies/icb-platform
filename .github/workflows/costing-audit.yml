name: Costing audit

# Excel <-> MES parity gate (v1.57). Compares the MES calculator against the
# committed GOLDEN (Burt's workbook, recalculated locally by `audit golden`)
# through the real /api/calculate code path. Never needs Excel or LibreOffice.
#
#   RT7 (v1.61.1, RT7_RULING_1 Q4) — ALL FIVE PACKS, EVERY TIME:
#   pull_request       every PR, no path filter. The five packs run as parallel jobs: ~1.5 min of wall time,
#                      +~10 s over smoke alone. Before RT7 a PR ran smoke only, and only when it touched a path
#                      list: a docs/ops PR ran nothing, and smoke (all 32D bodies) missed a 5 % 4G foam error
#                      that freezers, icecream and explosive caught.
#   push               backport/v1.39-base: the squash commit Michael merges gets its own full run.
#   workflow_dispatch  on demand.
#   (No `schedule`: GitHub fires schedules only from the DEFAULT branch, main, so the old "nightly" never ran
#   for backport/v1.39-base.) tests/costing_audit/test_rt7_ci_triggers.py keeps these three.
#
# The MES master data comes from tests/costing_audit/mes_snapshot/all.json,
# loaded into the isolated CI database (icb_test) — CI has no ICB database, so
# this is an ENGINE-drift gate over PROD's pricing (v1.57.3): the snapshot is
# exported from prod and paired with prod's accepted list (`--env prod`), whose
# entries pin their amounts (RT7). Dev is Michael's workbench and keeps its own
# list for local runs.

on:
  pull_request:
  push:
    branches: [backport/v1.39-base]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: costing audit (${{ matrix.pack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # RT7: every pack on every trigger (parallel jobs).
        pack: [smoke, chillers, freezers, icecream, explosive]
    env:
      DATABASE_URL: postgresql+psycopg://icb_app:icb_app_dev@localhost:5432/icb_test
      SESSION_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v5

      - name: Set up PostgreSQL
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@v6
        with:
          username: postgres
          password: postgres
          port: 5432

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system libs for pycairo (Linux)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Bootstrap database
        run: |
          psql "${{ steps.postgres.outputs.connection-uri }}" -f deploy/postgres/init.sql
          psql "${{ steps.postgres.outputs.connection-uri }}" -f deploy/postgres/init_test.sql

      - name: Alembic upgrade head (icb_test)
        working-directory: backend
        run: alembic upgrade head

      - name: Unit tests for the audit tool
        working-directory: backend
        run: pytest tests/costing_audit -o addopts=""

      - name: Audit run — pack ${{ matrix.pack }}
        working-directory: backend
        run: |
          python -m tools.costing_audit run --pack ${{ matrix.pack }} --mes-snapshot --env prod \
            --out ../costing_audit_reports --stem costing_audit_${{ matrix.pack }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: costing-audit-${{ matrix.pack }}
          path: costing_audit_reports/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if [ -f costing_audit_reports/costing_audit_${{ matrix.pack }}.md ]; then
            cat costing_audit_reports/costing_audit_${{ matrix.pack }}.md >> "$GITHUB_STEP_SUMMARY"
          fi
