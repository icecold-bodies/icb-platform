# Costing audit — CHILLERS. Three size classes, each swept across its length band.
# Add lengths/widths/heights freely; every combination becomes a scenario. Then:
# audit golden --pack chillers ...
#
# RT2 (RT2_RULING_1 R1/R5, RT2_DISPATCH Part 2.3): NO PU on any section of any chiller, any size
# (Burt, 1 Oct) — the all_pu, foam_4g and srd_pu variants are gone, and Burt's 21 Sep chiller sheets
# already carry every PU flag at N, so as_sheet / srd / drd are all-EPS. Sizes are pinned to the
# golden this replaces (widths/heights used to follow each sheet's last-used state).
name: chillers
workbook_month: "2026-09"
tolerance_pct: 1.0
gate_mode: as_sheet
bodies:
  - sheet: "UP TO 2.3 CHILLER BODY"
    lengths: [1.8, 2.3, 2.7]
    widths: [1.8]
    heights: [1.8]
    variants: [as_sheet, all_eps, srd, drd]
  - sheet: "UP TO 5.5 CHILLER AND 2.3 WIDE"
    lengths: [3.0, 4.2, 5.5]
    widths: [2.3]
    heights: [2.3]
    variants: [as_sheet, all_eps, srd, drd]
  - sheet: " 4.9 & UP CHILLER AND 2.5 WIDE "
    lengths: [4.9, 5.8, 7.5, 8.5]
    widths: [2.5, 2.6]
    heights: [2.56]
    variants: [as_sheet, all_eps, srd, drd]
